<script>
(function () {
  const options = {"home":false,"opacity":0.5,"count":100};
  const canvas = document.createElement('canvas');
  canvas.setAttribute('aria-hidden', 'true');
  canvas.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:' + options.opacity;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let width, height, points = [], frame;
  const pointer = { x: null, y: null };
  function resize() {
    const previousWidth = width;
    const previousHeight = height;
    width = Math.max(1, window.innerWidth);
    height = Math.max(1, window.innerHeight);
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    // count describes density at 1280 × 800 CSS pixels, independent of pixel ratio.
    const count = Math.min(240, Math.round(options.count * width * height / (1280 * 800)));
    points.forEach(p => {
      p.x *= width / previousWidth;
      p.y *= height / previousHeight;
    });
    points.length = Math.min(points.length, count);
    while (points.length < count) {
      points.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.45, vy: (Math.random() - 0.5) * 0.45 });
    }
    pointer.x = pointer.y = null;
    if (reducedMotion.matches || document.hidden) draw();
  }
  function draw() {
    ctx.clearRect(0, 0, width, height);
    const color = document.body.classList.contains('dark-theme') ? '210,220,228' : '91,110,122';
    points.forEach((p, index) => {
      if (!reducedMotion.matches) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;
      }
      ctx.fillStyle = 'rgba(' + color + ',0.6)';
      ctx.fillRect(p.x, p.y, 1, 1);
      function connect(q, radius) {
        const distance = Math.hypot(p.x - q.x, p.y - q.y);
        if (distance < radius) {
          ctx.beginPath(); ctx.lineWidth = options.home ? 0.8 : 0.7;
          ctx.strokeStyle = 'rgba(' + color + ',' + (0.55 * (1 - distance / radius)) + ')';
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
      for (let j = index + 1; j < points.length; j++) connect(points[j], 130);
      if (pointer.x !== null && !reducedMotion.matches) connect(pointer, 150);
    });
  }
  function animate() { draw(); frame = requestAnimationFrame(animate); }
  function start() { cancelAnimationFrame(frame); if (reducedMotion.matches || document.hidden) draw(); else animate(); }
  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') { pointer.x = e.clientX; pointer.y = e.clientY; } });
  document.documentElement.addEventListener('pointerleave', () => { pointer.x = pointer.y = null; });
  document.addEventListener('visibilitychange', start);
  reducedMotion.addEventListener('change', start);
  new MutationObserver(() => { if (reducedMotion.matches) draw(); }).observe(document.body, { attributes:true, attributeFilter:['class'] });
  resize(); start();
})();
</script>
